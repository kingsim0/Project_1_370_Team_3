
version: '3.8'
services:
  mongo:
    image: mongo
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      - SERVICE=userService.py

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "5001:5001"
    depends_on:
      - mongo
    environment:
      - SERVICE=orderService.py

  product-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "5002:5002"
    depends_on:
      - mongo
    environment:
      - SERVICE=productService.py
